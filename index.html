<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스마트 프로젝트 빌더 v5.7</title>
    <style>
        :root {
            --primary: #1e40af;
            --accent: #3b82f6;
            --bg: #f8fafc;
            --card: #ffffff;
            --border: #e2e8f0;
            --text: #1e293b;
        }

        body { font-family: 'Pretendard', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 10px; line-height: 1.6; }
        .container { max-width: 750px; margin: 0 auto; background: var(--card); padding: 30px; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }

        .progress-container { width: 100%; height: 6px; background: #e2e8f0; border-radius: 10px; margin-bottom: 30px; }
        .progress-bar { height: 100%; background: var(--primary); border-radius: 10px; width: 14.2%; transition: 0.3s; }
        .step-count { font-size: 13px; font-weight: 700; color: var(--accent); margin-bottom: 5px; display: block; }

        .step-section { display: none; }
        .step-section.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        .q-label { font-size: 20px; font-weight: 800; margin-bottom: 20px; display: block; color: var(--primary); }
        .item-label { font-weight: 700; font-size: 14px; margin-top: 15px; display: block; color: #475569; }

        .category-group { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 15px; }
        .cat-btn { padding: 14px; border: 2px solid #e2e8f0; border-radius: 12px; cursor: pointer; text-align: center; font-weight: 600; transition: 0.2s; background: #fff; font-size: 13px; }
        .cat-btn.selected { border-color: var(--primary); background: #eff6ff; color: var(--primary); }

        select, input { width: 100%; padding: 12px; border: 2px solid #e2e8f0; border-radius: 10px; font-size: 14px; box-sizing: border-box; margin-top: 8px; }

        .spec-builder { background: #f1f5f9; padding: 15px; border-radius: 15px; margin-top: 20px; }
        .spec-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        @media (min-width: 600px) { .spec-row { grid-template-columns: 1fr 0.6fr 1fr 1fr 1fr 50px; } }
        
        .added-table { width: 100%; border-collapse: collapse; background: white; margin-top: 15px; font-size: 12px; border-radius: 10px; overflow-x: auto; display: block; }
        .added-table table { width: 100%; border-collapse: collapse; min-width: 500px; }
        .added-table th, .added-table td { border: 1px solid #e2e8f0; padding: 12px; text-align: center; }
        
        .edit-num { background: #fffdf0; color: #b45309; font-weight: 700; border: 1px solid #fde68a; border-radius: 4px; padding: 2px 5px; width: 40px; text-align: center; outline: none; }
        .del-btn { color: #ef4444; font-weight: 800; cursor: pointer; }

        .nav-btns { margin-top: 30px; display: flex; gap: 10px; }
        .btn-prev { background: #e2e8f0; color: #475569; width: 80px; }
        .btn-next { background: var(--primary); color: white; flex: 1; }
        button { padding: 15px; border-radius: 12px; border: none; font-weight: 700; cursor: pointer; }

        #resultView { display: none; }
        .final-box { border: 2px solid var(--primary); padding: 20px; border-radius: 20px; }
        .res-table { width: 100%; border-collapse: collapse; }
        .res-table th { background: #f8fafc; width: 120px; text-align: left; padding: 12px; border: 1px solid #e2e8f0; font-size: 13px; }
        .res-table td { padding: 12px; border: 1px solid #e2e8f0; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <span class="step-count" id="stepIndicator">STEP 1 / 7</span>
    <div class="progress-container"><div class="progress-bar" id="progressBar"></div></div>

    <div id="formView">
        <div class="step-section active" data-step="1">
            <span class="q-label">프로젝트 명칭</span>
            <input type="text" id="brandName" placeholder="예: 2026 하반기 캠페인">
            <span class="item-label">제작 대분류</span>
            <select id="contentType">
                <option value="브랜드 홍보 영상">브랜드 홍보 영상 (TVCF)</option>
                <option value="디지털 SNS 광고">디지털/SNS 광고</option>
                <option value="오프라인 사이니지">오프라인 매장/전광판</option>
            </select>
        </div>

        <div class="step-section" data-step="2">
            <span class="q-label">핵심 강점(USP) 선택</span>
            <div class="category-group">
                <div class="cat-btn" onclick="selectUSP('성능/기술', ['최첨단 기술력', '특허받은 안전성', '압도적인 성능'])">성능/기술</div>
                <div class="cat-btn" onclick="selectUSP('디자인/감성', ['심미적 디자인', '힙한 트렌드', '따뜻한 감성'])">디자인/감성</div>
                <div class="cat-btn" onclick="selectUSP('가격/가성비', ['합리적 가격', '극강의 가성비', '유지비 절감'])">가격/가성비</div>
                <div class="cat-btn" onclick="selectUSP('철학/가치', ['친환경/지속가능', '진정성 있는 스토리', '신뢰와 전통'])">철학/가치</div>
                <div class="cat-btn" onclick="selectUSP('서비스/편의', ['직관적 편의성', '빠른 고객대응', '맞춤형 솔루션'])">서비스/편의</div>
            </div>
            <select id="uspDetail" style="display:none;"></select>
            <input type="text" id="uspCustom" placeholder="상기 항목 외 직접 입력">
        </div>

        <div class="step-section" data-step="3">
            <span class="q-label">목표 및 목적</span>
            <div class="category-group">
                <div class="cat-btn" onclick="selectGoal('인지도', ['브랜드 존재감 알리기', '대중적 바이럴 확보'])">인지도 확산</div>
                <div class="cat-btn" onclick="selectGoal('세일즈', ['판매 즉각 증대', '신규 유입 확보'])">매출 유도</div>
                <div class="cat-btn" onclick="selectGoal('브랜딩', ['프리미엄 이미지', '신뢰도 제고'])">브랜딩 강화</div>
                <div class="cat-btn" onclick="selectGoal('팬덤/소통', ['충성고객 확보', '커뮤니티 활성화'])">팬덤 소통</div>
            </div>
            <select id="goalDetail" style="display:none;"></select>
        </div>

        <div class="step-section" data-step="4">
            <span class="q-label">세부 타겟팅</span>
            <span class="item-label">1. 연령대</span>
            <select id="targetAge"><option>1020 Z세대</option><option>2030 밀레니얼</option><option>3040 핵심소비층</option><option>5060 시니어</option></select>
            <span class="item-label">2. 직업군</span>
            <select id="targetJob"><option>일반 사무직</option><option>전문직</option><option>자영업/프리랜서</option><option>학생</option></select>
            <span class="item-label">3. 관심사</span>
            <select id="targetLife"><option>자기계발/운동</option><option>가치소비/환경</option><option>반려동물 가구</option><option>얼리어답터</option></select>
        </div>

        <div class="step-section" data-step="5">
            <span class="q-label">톤앤매너 조합</span>
            <span class="item-label">비주얼 스타일</span>
            <div class="category-group" id="visualGroup">
                <div class="cat-btn" onclick="setVisual(this, '시네마틱')">시네마틱</div>
                <div class="cat-btn" onclick="setVisual(this, '미니멀')">미니멀</div>
                <div class="cat-btn" onclick="setVisual(this, '비비드')">비비드</div>
                <div class="cat-btn" onclick="setVisual(this, '레트로')">레트로</div>
            </div>
            <span class="item-label">편집 템포</span>
            <div class="category-group" id="tempoGroup">
                <div class="cat-btn" onclick="setTempo(this, '빠른 템포')">빠른 호흡</div>
                <div class="cat-btn" onclick="setTempo(this, '느린 템포')">여유로운 호흡</div>
                <div class="cat-btn" onclick="setTempo(this, '안정적 템포')">안정적인 호흡</div>
            </div>
        </div>

        <div class="step-section" data-step="6">
            <span class="q-label">플랫폼 (중복)</span>
            <div class="category-group" id="pfGroup">
                <div class="cat-btn" onclick="this.classList.toggle('selected')">유튜브</div>
                <div class="cat-btn" onclick="this.classList.toggle('selected')">릴스/쇼츠</div>
                <div class="cat-btn" onclick="this.classList.toggle('selected')">TV 광고</div>
                <div class="cat-btn" onclick="this.classList.toggle('selected')">외부 전광판</div>
            </div>
        </div>

        <div class="step-section" data-step="7">
            <span class="q-label">규격 및 수량</span>
            <div class="spec-builder">
                <div class="spec-row">
                    <div><label>분량</label><input type="number" id="sDur" placeholder="30"></div>
                    <div><label>단위</label><select id="sUnit"><option value="초">초</option><option value="분">분</option></select></div>
                    <div><label>비율</label><select id="sRatio"><option>16:9</option><option>9:16</option></select></div>
                    <div><label>해상도</label><select id="sRes"><option>4K</option><option>FHD</option></select></div>
                    <div><label>프레임</label><select id="sFps"><option>24fps</option><option selected>30fps</option></select></div>
                    <button type="button" onclick="addSpec()" style="background:var(--primary); color:white;">+</button>
                </div>
                <input type="number" id="sQty" placeholder="수량 입력" style="width:100px; margin-top:5px;">
                <div class="added-table" id="specTable" style="display:none;">
                    <table>
                        <thead><tr><th>분량</th><th>비율</th><th>해상도</th><th>수량</th><th>삭제</th></tr></thead>
                        <tbody id="specBody"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="nav-btns">
            <button class="btn-prev" id="prevBtn" style="visibility:hidden;" onclick="moveStep(-1)">이전</button>
            <button class="btn-next" id="nextBtn" onclick="moveStep(1)">다음으로</button>
        </div>
    </div>

    <div id="resultView">
        <header><h1>STRATEGY SHEET</h1></header>
        <div class="final-box">
            <div class="final-sentence" id="resSentence" style="font-size:18px; line-height:1.7; margin-bottom:20px;"></div>
            <table class="res-table" id="resBody"></table>
        </div>
        <div class="nav-btns">
            <button class="btn-next" onclick="window.print()">저장하기</button>
            <button class="btn-prev" onclick="location.reload()">처음으로</button>
        </div>
    </div>
</div>

<script>
    let step = 1;
    let specs = [];
    let sel = { visual: '', tempo: '', uspCat: '', uspSub: '', goalCat: '', goalSub: '' };

    function moveStep(n) {
        if(n === 1 && step === 1 && !document.getElementById('brandName').value) return alert("제목을 써주세요");
        document.querySelector(`[data-step="${step}"]`).classList.remove('active');
        step += n;
        if(step > 7) return showResult();
        document.querySelector(`[data-step="${step}"]`).classList.add('active');
        document.getElementById('stepIndicator').innerText = `STEP ${step} / 7`;
        document.getElementById('progressBar').style.width = (step * 14.2) + '%';
        document.getElementById('prevBtn').style.visibility = step === 1 ? 'hidden' : 'visible';
    }

    function selectUSP(cat, subs) { 
        sel.uspCat = cat; const el = document.getElementById('uspDetail'); el.style.display = 'block';
        el.innerHTML = subs.map(s => `<option value="${s}">${s}</option>`).join('');
        sel.uspSub = subs[0]; el.onchange = (e) => sel.uspSub = e.target.value;
        highlight('[data-step="2"]', cat);
    }

    function selectGoal(cat, subs) { 
        sel.goalCat = cat; const el = document.getElementById('goalDetail'); el.style.display = 'block';
        el.innerHTML = subs.map(s => `<option value="${s}">${s}</option>`).join('');
        sel.goalSub = subs[0]; el.onchange = (e) => sel.goalSub = e.target.value;
        highlight('[data-step="3"]', cat);
    }

    function setVisual(btn, val) { sel.visual = val; highlight('#visualGroup', btn.innerText); }
    function setTempo(btn, val) { sel.tempo = val; highlight('#tempoGroup', btn.innerText); }
    function highlight(parent, text) {
        document.querySelector(parent).querySelectorAll('.cat-btn').forEach(b => b.classList.toggle('selected', b.innerText === text));
    }

    function addSpec() {
        const d = document.getElementById('sDur').value;
        const u = document.getElementById('sUnit').value;
        const q = document.getElementById('sQty').value || 1;
        if(!d) return;
        specs.push({ d, u, r: document.getElementById('sRatio').value, s: document.getElementById('sRes').value, q });
        renderSpecs();
    }

    function renderSpecs() {
        document.getElementById('specTable').style.display = 'block';
        document.getElementById('specBody').innerHTML = specs.map((x, i) => `
            <tr>
                <td><input type="number" class="edit-num" value="${x.d}" onchange="specs[${i}].d=this.value">${x.u}</td>
                <td>${x.r}</td><td>${x.s}</td>
                <td><input type="number" class="edit-num" value="${x.q}" onchange="specs[${i}].q=this.value">개</td>
                <td><span class="del-btn" onclick="specs.splice(${i},1);renderSpecs();">×</span></td>
            </tr>
        `).join('');
    }

    function showResult() {
        document.getElementById('formView').style.display = 'none';
        document.getElementById('resultView').style.display = 'block';
        const brand = document.getElementById('brandName').value;
        const pfs = Array.from(document.querySelectorAll('#pfGroup .cat-btn.selected')).map(b => b.innerText).join(', ');

        document.getElementById('resSentence').innerHTML = `<b>${brand}</b>은 <b>${sel.uspSub}</b> 강점을 바탕으로 <b>${sel.visual}</b>한 감각과 <b>${sel.tempo}</b>를 통해 프로젝트를 완성합니다.`;
        
        const rows = [
            {l: '타겟층', v: `${document.getElementById('targetAge').value} / ${document.getElementById('targetJob').value}`},
            {l: '톤앤매너', v: `${sel.visual} / ${sel.tempo}`},
            {l: '플랫폼', v: pfs || '미지정'},
            {l: '세부 사양', v: specs.map(s => `${s.d}${s.u} | ${s.r} | ${s.q}개`).join('<br>')}
        ];
        document.getElementById('resBody').innerHTML = rows.map(r => `<tr><th>${r.l}</th><td>${r.v}</td></tr>`).join('');
    }
</script>
</body>
</html>
