<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스마트 프로젝트 빌더 v5.9</title>
    <style>
        :root { --primary: #1e40af; --accent: #3b82f6; --bg: #f1f5f9; --card: #ffffff; --text: #1e293b; }
        body { font-family: 'Pretendard', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 15px; }
        .container { max-width: 800px; margin: 0 auto; background: var(--card); padding: 30px; border-radius: 24px; box-shadow: 0 10px 40px rgba(0,0,0,0.08); }
        
        .step-nav { display: flex; overflow-x: auto; gap: 8px; margin-bottom: 25px; padding-bottom: 10px; }
        .nav-dot { flex-shrink: 0; padding: 6px 14px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 20px; font-size: 11px; font-weight: 700; cursor: pointer; color: #94a3b8; }
        .nav-dot.active { background: var(--primary); color: white; border-color: var(--primary); }

        .progress-container { width: 100%; height: 6px; background: #e2e8f0; border-radius: 10px; margin-bottom: 25px; }
        .progress-bar { height: 100%; background: var(--primary); border-radius: 10px; width: 14.2%; transition: 0.4s; }

        .step-section { display: none; }
        .step-section.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .q-label { font-size: 22px; font-weight: 800; margin-bottom: 20px; display: block; color: var(--primary); }
        .category-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .cat-btn { padding: 16px; border: 2px solid #e2e8f0; border-radius: 14px; cursor: pointer; text-align: center; font-weight: 600; font-size: 14px; background: #fff; }
        .cat-btn.selected { border-color: var(--primary); background: #eff6ff; color: var(--primary); }

        select, input { width: 100%; padding: 14px; border: 2px solid #e2e8f0; border-radius: 12px; font-size: 15px; box-sizing: border-box; margin-top: 10px; }
        
        .spec-builder { background: #f8fafc; padding: 20px; border-radius: 18px; border: 1px solid #e2e8f0; margin-top: 20px; }
        .spec-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 15px; align-items: end; }
        @media (min-width: 600px) { .spec-row { grid-template-columns: 1.2fr 0.8fr 1fr 1fr 1fr 60px; } }

        .added-table-wrapper { overflow-x: auto; margin-top: 20px; border-radius: 12px; border: 1px solid #e2e8f0; }
        .added-table { width: 100%; border-collapse: collapse; background: white; font-size: 13px; min-width: 600px; }
        .added-table th { background: #f1f5f9; padding: 12px; border-bottom: 2px solid #e2e8f0; }
        .added-table td { padding: 8px; border-bottom: 1px solid #f1f5f9; text-align: center; }

        /* 입력 및 수정 스타일 */
        .edit-num { width: 50px; padding: 6px; border: 1px solid #fde68a; background: #fffdf0; border-radius: 6px; text-align: center; font-weight: 700; color: #b45309; font-size: 14px; }
        .unit-badge { background: #e0f2fe; color: #0369a1; padding: 4px 8px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 800; }
        .list-select { padding: 4px; border-radius: 6px; border: 1px solid #cbd5e1; font-size: 12px; width: 90%; }
        .del-btn { color: #ef4444; font-weight: 800; cursor: pointer; padding: 5px; }

        .nav-btns { margin-top: 30px; display: flex; gap: 10px; }
        .btn-prev { background: #e2e8f0; color: #475569; width: 90px; }
        .btn-next { background: var(--primary); color: white; flex: 1; font-size: 16px; font-weight: 700; cursor: pointer; border: none; border-radius: 16px; }

        #resultView { display: none; }
        .final-box { border: 2px solid var(--primary); padding: 25px; border-radius: 24px; }
        .res-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .res-table th { background: #f8fafc; width: 130px; text-align: left; padding: 15px; border: 1px solid #e2e8f0; font-size: 14px; }
        .res-table td { padding: 15px; border: 1px solid #e2e8f0; font-size: 15px; }
    </style>
</head>
<body>

<div class="container">
    <div class="step-nav no-print" id="stepNav">
        <div class="nav-dot active" onclick="goToStep(1)">1.제목</div>
        <div class="nav-dot" onclick="goToStep(2)">2.USP</div>
        <div class="nav-dot" onclick="goToStep(3)">3.목표</div>
        <div class="nav-dot" onclick="goToStep(4)">4.타겟</div>
        <div class="nav-dot" onclick="goToStep(5)">5.톤앤매너</div>
        <div class="nav-dot" onclick="goToStep(6)">6.플랫폼</div>
        <div class="nav-dot" onclick="goToStep(7)">7.사양</div>
    </div>

    <div class="progress-container"><div class="progress-bar" id="progressBar"></div></div>

    <div id="formView">
        <div class="step-section active" data-step="1">
            <span class="q-label">프로젝트 명칭</span>
            <input type="text" id="brandName" placeholder="프로젝트 이름을 입력하세요">
            <select id="contentType" style="margin-top:20px;">
                <option value="종합 홍보 영상">종합 홍보 영상</option>
                <option value="SNS 광고 소재">SNS 광고 소재</option>
                <option value="전시/박람회">전시/박람회용</option>
            </select>
        </div>

        <div class="step-section" data-step="2">
            <span class="q-label">제품 핵심 경쟁력 (USP)</span>
            <div class="category-group">
                <div class="cat-btn" onclick="selectUSP('성능', ['최첨단 하드웨어', '독보적 특허', '내구성 및 신뢰성', '압도적 사양', '기술적 우위'])">성능/기술</div>
                <div class="cat-btn" onclick="selectUSP('디자인', ['미니멀 디자인', '트렌디한 감성', '사용자 경험(UX)', '프리미엄 소재', '심미적 완성도'])">디자인/감성</div>
                <div class="cat-btn" onclick="selectUSP('가격', ['극강의 가성비', '합리적 가격대', '유지비 절감', '구독형 모델', '가심비 만족'])">가격/경제성</div>
                <div class="cat-btn" onclick="selectUSP('가치', ['친환경 스토리', '브랜드 헤리티지', '지속가능성', '진정성', 'MZ 팬덤'])">브랜드 가치</div>
            </div>
            <select id="uspDetail" style="display:none;"></select>
        </div>

        <div class="step-section" data-step="3">
            <span class="q-label">프로젝트 주요 목표</span>
            <div class="category-group">
                <div class="cat-btn" onclick="selectGoal('인지도', ['브랜드 런칭 각인', '바이럴 이슈화', '검색량 증대', '도달율 극대화'])">인지도 확산</div>
                <div class="cat-btn" onclick="selectGoal('매출', ['구매 전환 유도', '신규 회원 확보', '장바구니 증대', '재구매 유도'])">매출 유도</div>
                <div class="cat-btn" onclick="selectGoal('브랜딩', ['이미지 구축', '전문성 확보', '리뉴얼 알림', '신뢰도 제고'])">브랜딩 강화</div>
                <div class="cat-btn" onclick="selectGoal('소통', ['SNS 팔로워 증대', '커뮤니티 활성', '참여 캠페인', '로열티 강화'])">소통 및 팬덤</div>
            </div>
            <select id="goalDetail" style="display:none;"></select>
        </div>

        <div class="step-section" data-step="4">
            <span class="q-label">핵심 타겟층</span>
            <select id="targetAge"><option>2030 밀레니얼</option><option>3040 핵심소비층</option></select>
            <select id="targetJob" style="margin-top:10px;"><option>전문직/사무직</option><option>자영업/프리랜서</option></select>
        </div>

        <div class="step-section" data-step="5">
            <span class="q-label">톤앤매너</span>
            <div class="category-group" id="visualGroup">
                <div class="cat-btn" onclick="setVisual(this, '시네마틱')">시네마틱</div>
                <div class="cat-btn" onclick="setVisual(this, '미니멀')">미니멀</div>
            </div>
            <div class="category-group" id="tempoGroup">
                <div class="cat-btn" onclick="setTempo(this, '빠른 템포')">빠른 템포</div>
                <div class="cat-btn" onclick="setTempo(this, '안정적 템포')">안정적 템포</div>
            </div>
        </div>

        <div class="step-section" data-step="6">
            <span class="q-label">플랫폼 선택</span>
            <div class="category-group" id="pfGroup">
                <div class="cat-btn" onclick="this.classList.toggle('selected')">유튜브</div>
                <div class="cat-btn" onclick="this.classList.toggle('selected')">인스타그램</div>
                <div class="cat-btn" onclick="this.classList.toggle('selected')">TVCF</div>
            </div>
        </div>

        <div class="step-section" data-step="7">
            <span class="q-label">제작 사양 정의</span>
            <div class="spec-builder">
                <div class="spec-row">
                    <div><label style="font-size:11px;font-weight:bold;">분량</label><input type="number" id="sDur" placeholder="30" onfocus="this.value=''"></div>
                    <div><label style="font-size:11px;font-weight:bold;">단위</label><select id="sUnit"><option>초</option><option>분</option></select></div>
                    <div><label style="font-size:11px;font-weight:bold;">비율</label><select id="sRatio"><option>16:9 가로</option><option>9:16 세로</option><option>1:1 정방</option></select></div>
                    <div><label style="font-size:11px;font-weight:bold;">해상도</label><select id="sRes"><option>4K</option><option>FHD</option></select></div>
                    <div><label style="font-size:11px;font-weight:bold;">수량</label><input type="number" id="sQty" value="1" onfocus="this.value=''"></div>
                    <button type="button" onclick="addSpec()" style="background:var(--primary); color:white; padding:10px; border-radius:10px; border:none; cursor:pointer;">+</button>
                </div>
                
                <div class="added-table-wrapper" id="specTable" style="display:none;">
                    <table class="added-table">
                        <thead><tr><th>분량</th><th>비율</th><th>해상도</th><th>수량</th><th>삭제</th></tr></thead>
                        <tbody id="specBody"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="nav-btns">
            <button class="btn-prev" id="prevBtn" style="visibility:hidden;" onclick="moveStep(-1)">이전</button>
            <button class="btn-next" onclick="moveStep(1)">다음으로</button>
        </div>
    </div>

    <div id="resultView">
        <header><h1 style="color:var(--primary);">PROJECT STRATEGY SHEET</h1></header>
        <div class="final-box">
            <div id="resSentence" style="font-size:17px; margin-bottom:20px; line-height:1.6;"></div>
            <table class="res-table" id="resBody"></table>
        </div>
        <div class="nav-btns">
            <button class="btn-next" onclick="window.print()">저장/인쇄</button>
            <button class="btn-prev" style="width:auto; padding:0 20px;" onclick="goToStep(1)">수정하기</button>
        </div>
    </div>
</div>

<script>
    let currentStep = 1;
    let specs = [];
    let sel = { visual: '', tempo: '', uspSub: '', goalSub: '' };

    function goToStep(n) {
        document.getElementById('formView').style.display = 'block';
        document.getElementById('resultView').style.display = 'none';
        document.querySelectorAll('.step-section').forEach(s => s.classList.remove('active'));
        currentStep = n;
        document.querySelector(`[data-step="${currentStep}"]`).classList.add('active');
        updateProgress();
    }

    function moveStep(n) {
        if(n === 1 && currentStep === 1 && !document.getElementById('brandName').value) return alert("제목을 써주세요");
        if(currentStep + n > 7) return showResult();
        goToStep(currentStep + n);
    }

    function updateProgress() {
        document.getElementById('progressBar').style.width = (currentStep * 14.2) + '%';
        document.querySelectorAll('.nav-dot').forEach((d, i) => d.classList.toggle('active', i + 1 === currentStep));
        document.getElementById('prevBtn').style.visibility = currentStep === 1 ? 'hidden' : 'visible';
    }

    function selectUSP(cat, subs) { 
        const el = document.getElementById('uspDetail'); el.style.display = 'block';
        el.innerHTML = subs.map(s => `<option value="${s}">${s}</option>`).join('');
        sel.uspSub = subs[0]; el.onchange = (e) => sel.uspSub = e.target.value;
        highlightBtn('[data-step="2"]', cat);
    }

    function selectGoal(cat, subs) { 
        const el = document.getElementById('goalDetail'); el.style.display = 'block';
        el.innerHTML = subs.map(s => `<option value="${s}">${s}</option>`).join('');
        sel.goalSub = subs[0]; el.onchange = (e) => sel.goalSub = e.target.value;
        highlightBtn('[data-step="3"]', cat);
    }

    function setVisual(btn, val) { sel.visual = val; highlightBtn('#visualGroup', btn.innerText); }
    function setTempo(btn, val) { sel.tempo = val; highlightBtn('#tempoGroup', btn.innerText); }
    function highlightBtn(parent, text) {
        document.querySelector(parent).querySelectorAll('.cat-btn').forEach(b => b.classList.toggle('selected', b.innerText === text));
    }

    function addSpec() {
        const d = document.getElementById('sDur').value;
        if(!d) return;
        specs.push({ 
            d: d, u: document.getElementById('sUnit').value, 
            r: document.getElementById('sRatio').value, 
            s: document.getElementById('sRes').value, 
            q: document.getElementById('sQty').value 
        });
        renderSpecs();
        document.getElementById('sDur').value = '';
    }

    // 리스트 내 수정 로직 강화
    function renderSpecs() {
        document.getElementById('specTable').style.display = 'block';
        document.getElementById('specBody').innerHTML = specs.map((x, i) => `
            <tr>
                <td>
                    <input type="number" class="edit-num" value="${x.d}" onfocus="this.value=''" onchange="specs[${i}].d=this.value">
                    <span class="unit-badge" onclick="toggleUnit(${i})">${x.u}</span>
                </td>
                <td>
                    <select class="list-select" onchange="specs[${i}].r=this.value">
                        <option ${x.r==='16:9 가로'?'selected':''}>16:9 가로</option>
                        <option ${x.r==='9:16 세로'?'selected':''}>9:16 세로</option>
                        <option ${x.r==='1:1 정방'?'selected':''}>1:1 정방</option>
                    </select>
                </td>
                <td>
                    <select class="list-select" onchange="specs[${i}].s=this.value">
                        <option ${x.s==='4K'?'selected':''}>4K</option>
                        <option ${x.s==='FHD'?'selected':''}>FHD</option>
                    </select>
                </td>
                <td>
                    <input type="number" class="edit-num" value="${x.q}" onfocus="this.value=''" onchange="specs[${i}].q=this.value">개
                </td>
                <td><span class="del-btn" onclick="specs.splice(${i},1);renderSpecs();">×</span></td>
            </tr>
        `).join('');
    }

    function toggleUnit(i) {
        specs[i].u = (specs[i].u === '초') ? '분' : '초';
        renderSpecs();
    }

    function showResult() {
        document.getElementById('formView').style.display = 'none';
        document.getElementById('resultView').style.display = 'block';
        const pfs = Array.from(document.querySelectorAll('#pfGroup .cat-btn.selected')).map(b => b.innerText).join(', ');
        document.getElementById('resSentence').innerHTML = `<b>${document.getElementById('brandName').value}</b> 프로젝트는 <b>${sel.uspSub}</b> 강점을 <b>${sel.visual}</b> 연출로 제안합니다.`;
        const rows = [
            {l: '톤앤매너', v: `${sel.visual} / ${sel.tempo}`},
            {l: '송출 플랫폼', v: pfs || '미지정'},
            {l: '상세 사양', v: specs.map(s => `${s.d}${s.u} | ${s.r} | ${s.s} | ${s.q}개`).join('<br>')}
        ];
        document.getElementById('resBody').innerHTML = rows.map(r => `<tr><th>${r.l}</th><td>${r.v}</td></tr>`).join('');
    }
</script>
</body>
</html>
