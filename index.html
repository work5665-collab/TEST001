<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스마트 프로젝트 빌더 v5.4</title>
    <style>
        :root {
            --primary: #1e40af;
            --accent: #3b82f6;
            --bg: #f8fafc;
            --card: #ffffff;
            --border: #e2e8f0;
            --text: #1e293b;
        }

        body { font-family: 'Pretendard', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; line-height: 1.6; }
        .container { max-width: 750px; margin: 0 auto; background: var(--card); padding: 40px; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }

        .progress-container { width: 100%; height: 6px; background: #e2e8f0; border-radius: 10px; margin-bottom: 40px; }
        .progress-bar { height: 100%; background: var(--primary); border-radius: 10px; width: 14.2%; transition: 0.3s; }
        .step-count { font-size: 13px; font-weight: 700; color: var(--accent); margin-bottom: 10px; display: block; }

        .step-section { display: none; }
        .step-section.active { display: block; animation: fadeIn 0.4s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .q-label { font-size: 22px; font-weight: 800; margin-bottom: 25px; display: block; color: var(--primary); }
        .item-label { font-weight: 700; font-size: 15px; margin-top: 20px; display: block; color: #475569; }

        .category-group { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 15px; }
        .cat-btn { padding: 18px; border: 2px solid #e2e8f0; border-radius: 12px; cursor: pointer; text-align: center; font-weight: 600; transition: 0.2s; background: #fff; }
        .cat-btn.selected { border-color: var(--primary); background: #eff6ff; color: var(--primary); }

        select, input { width: 100%; padding: 15px; border: 2px solid #e2e8f0; border-radius: 12px; font-size: 15px; box-sizing: border-box; margin-top: 10px; }

        .spec-builder { background: #f1f5f9; padding: 25px; border-radius: 15px; margin-top: 20px; }
        .spec-row { display: grid; grid-template-columns: 1fr 0.6fr 1.2fr 1fr 1fr 50px; gap: 8px; margin-bottom: 10px; align-items: end; }
        .spec-row label { font-size: 11px; font-weight: 700; margin-bottom: 5px; display: block; }
        .spec-row input, .spec-row select { margin: 0; padding: 10px; font-size: 13px; }

        .added-table { width: 100%; border-collapse: collapse; background: white; margin-top: 15px; font-size: 12px; }
        .added-table th, .added-table td { border: 1px solid #e2e8f0; padding: 10px; text-align: center; }

        .nav-btns { margin-top: 40px; display: flex; gap: 10px; }
        .btn-prev { background: #e2e8f0; color: #475569; width: 100px; }
        .btn-next { background: var(--primary); color: white; flex: 1; }
        button { padding: 18px; border-radius: 14px; border: none; font-weight: 700; cursor: pointer; }

        #resultView { display: none; }
        .final-box { border: 2px solid var(--primary); padding: 30px; border-radius: 20px; }
        .final-sentence { font-size: 19px; line-height: 1.8; margin-bottom: 25px; border-bottom: 1px dashed #ddd; padding-bottom: 20px; }
        .final-sentence b { color: var(--primary); }
    </style>
</head>
<body>

<div class="container">
    <span class="step-count" id="stepIndicator">STEP 1 / 7</span>
    <div class="progress-container"><div class="progress-bar" id="progressBar"></div></div>

    <div id="formView">
        <div class="step-section active" data-step="1">
            <span class="q-label">프로젝트의 이름이 무엇인가요?</span>
            <input type="text" id="brandName" placeholder="예: 2026 SS 시즌 홍보 영상">
            <span class="item-label">콘텐츠 성격</span>
            <select id="contentType">
                <option value="브랜드 홍보 영상">홍보 영상 (브랜드 필름, TVCF)</option>
                <option value="SNS 광고 소재">SNS 소재 (릴스, 쇼츠)</option>
                <option value="전시/오프라인">전시/매장 콘텐츠</option>
            </select>
        </div>

        <div class="step-section" data-step="2">
            <span class="q-label">제품의 핵심 강점(USP)</span>
            <div class="category-group">
                <div class="cat-btn" onclick="selectUSP('성능', ['압도적 기술력', '강력한 성능', '특허받은 안전성'])">성능/기술</div>
                <div class="cat-btn" onclick="selectUSP('감성', ['감각적 디자인', '트렌디한 감성', '사용자 편의성'])">디자인/감성</div>
            </div>
            <select id="uspDetail" style="display:none;"></select>
            <input type="text" id="uspCustom" placeholder="직접 입력도 가능합니다" style="margin-top:10px;">
        </div>

        <div class="step-section" data-step="3">
            <span class="q-label">목표와 목적</span>
            <div class="category-group">
                <div class="cat-btn" onclick="selectGoal('인지도', ['브랜드 존재감 알리기', '대중적 바이럴 확보'])">인지도 확산</div>
                <div class="cat-btn" onclick="selectGoal('매출', ['직접 매출 증대', '신규 유입 확보'])">매출/행동 유도</div>
            </div>
            <select id="goalDetail" style="display:none;"></select>
        </div>

        <div class="step-section" data-step="4">
            <span class="q-label">타겟을 세분화해 볼까요?</span>
            
            <span class="item-label">1. 연령대</span>
            <select id="targetAge">
                <option value="1020 알파/Z세대">1020 알파/Z세대</option>
                <option value="2030 사회초년생">2030 사회초년생/밀레니얼</option>
                <option value="3040 핵심 소비층">3040 핵심 소비층</option>
                <option value="5060 액티브 시니어">5060 액티브 시니어</option>
            </select>

            <span class="item-label">2. 주요 직업군</span>
            <select id="targetJob">
                <option value="사무직 직장인">사무직 직장인</option>
                <option value="학생 및 취준생">학생 및 취준생</option>
                <option value="자영업/비즈니스">자영업 및 비즈니스 운영자</option>
                <option value="전문직">전문직 (의료, IT, 예술 등)</option>
                <option value="전업 주부">전업 주부</option>
            </select>

            <span class="item-label">3. 라이프스타일/관심사</span>
            <select id="targetLife">
                <option value="자기계발/운동 매니아">자기계발 및 운동 매니아</option>
                <option value="가치소비(환경/비건)">가치소비 (환경, 비건 관심층)</option>
                <option value="반려동물 가구">반려동물 가구</option>
                <option value="얼리어답터/테크">얼리어답터 및 테크 관심층</option>
                <option value="실속형/짠테크">실속형 소비자 (짠테크)</option>
            </select>
        </div>

        <div class="step-section" data-step="5">
            <span class="q-label">분위기와 템포 조합</span>
            
            <span class="item-label">비주얼 스타일</span>
            <div class="category-group" id="visualGroup">
                <div class="cat-btn" onclick="setVisual(this, '시네마틱한')">시네마틱</div>
                <div class="cat-btn" onclick="setVisual(this, '미니멀한')">미니멀/클린</div>
                <div class="cat-btn" onclick="setVisual(this, '비비드한')">비비드/팝</div>
                <div class="cat-btn" onclick="setVisual(this, '따스한')">감성/빈티지</div>
            </div>

            <span class="item-label">편집 템포</span>
            <div class="category-group" id="tempoGroup">
                <div class="cat-btn" onclick="setTempo(this, '빠르고 강렬한')">빠른 템포</div>
                <div class="cat-btn" onclick="setTempo(this, '차분하고 여유로운')">느린 템포</div>
                <div class="cat-btn" onclick="setTempo(this, '안정적이고 표준적인')">안정적 템포</div>
            </div>
        </div>

        <div class="step-section" data-step="6">
            <span class="q-label">송출 플랫폼 (중복 선택)</span>
            <div class="category-group">
                <div class="cat-btn pf-btn" onclick="togglePF(this)">유튜브</div>
                <div class="cat-btn pf-btn" onclick="togglePF(this)">릴스/쇼츠</div>
                <div class="cat-btn pf-btn" onclick="togglePF(this)">TV 광고</div>
                <div class="cat-btn pf-btn" onclick="togglePF(this)">외부 전광판</div>
            </div>
        </div>

        <div class="step-section" data-step="7">
            <span class="q-label">제작 규격 및 수량</span>
            <div class="spec-builder">
                <div class="spec-row">
                    <div><label>분량</label><input type="number" id="sDur" placeholder="30"></div>
                    <div><label>단위</label><select id="sUnit"><option value="초">초</option><option value="분">분</option></select></div>
                    <div><label>비율</label><select id="sRatio"><option value="16:9">16:9</option><option value="9:16">9:16</option></select></div>
                    <div><label>해상도</label><select id="sRes"><option value="4K">4K</option><option value="FHD">FHD</option><option value="720p">720p</option></select></div>
                    <div><label>프레임</label><select id="sFps"><option value="24fps">24fps</option><option value="30fps" selected>30fps</option><option value="60fps">60fps</option></select></div>
                    <button type="button" onclick="addSpec()" style="background:var(--primary); color:white;">+</button>
                </div>
                <input type="number" id="sQty" placeholder="수량(개)" style="width:100px; margin-top:10px;">
                <table class="added-table" id="specTable" style="display:none;">
                    <thead><tr><th>분량</th><th>비율</th><th>해상도</th><th>프레임</th><th>수량</th><th>-</th></tr></thead>
                    <tbody id="specBody"></tbody>
                </table>
            </div>
        </div>

        <div class="nav-btns">
            <button class="btn-prev" id="prevBtn" style="visibility:hidden;" onclick="moveStep(-1)">이전</button>
            <button class="btn-next" id="nextBtn" onclick="moveStep(1)">다음으로</button>
        </div>
    </div>

    <div id="resultView">
        <header><h1>PROJECT STRATEGY</h1></header>
        <div class="final-box">
            <div class="final-sentence" id="resSentence"></div>
            <table class="res-table" id="resBody"></table>
        </div>
        <div class="nav-btns">
            <button class="btn-next" onclick="window.print()">PDF 저장</button>
            <button class="btn-prev" onclick="location.reload()">다시 작성</button>
        </div>
    </div>
</div>

<script>
    let currStep = 1;
    let specs = [];
    let selectedData = { visual: '', tempo: '', uspCat: '', uspSub: '', goalCat: '', goalSub: '' };

    function moveStep(n) {
        if(n === 1 && currStep === 1 && !document.getElementById('brandName').value) return alert("이름을 입력하세요!");
        document.querySelector(`[data-step="${currStep}"]`).classList.remove('active');
        currStep += n;
        if(currStep > 7) return showResult();
        document.querySelector(`[data-step="${currStep}"]`).classList.add('active');
        document.getElementById('stepIndicator').innerText = `STEP ${currStep} / 7`;
        document.getElementById('progressBar').style.width = (currStep * 14.2) + '%';
        document.getElementById('prevBtn').style.visibility = currStep === 1 ? 'hidden' : 'visible';
        document.getElementById('nextBtn').innerText = currStep === 7 ? '정의서 완성' : '다음으로';
    }

    function selectUSP(cat, subs) { 
        selectedData.uspCat = cat; 
        const el = document.getElementById('uspDetail');
        el.style.display = 'block';
        el.innerHTML = subs.map(s => `<option value="${s}">${s}</option>`).join('');
        selectedData.uspSub = subs[0];
        el.onchange = (e) => selectedData.uspSub = e.target.value;
        highlightSingle('[data-step="2"]', cat);
    }

    function selectGoal(cat, subs) { 
        selectedData.goalCat = cat; 
        const el = document.getElementById('goalDetail');
        el.style.display = 'block';
        el.innerHTML = subs.map(s => `<option value="${s}">${s}</option>`).join('');
        selectedData.goalSub = subs[0];
        el.onchange = (e) => selectedData.goalSub = e.target.value;
        highlightSingle('[data-step="3"]', cat);
    }

    function setVisual(btn, val) { selectedData.visual = val; highlightSingle('#visualGroup', btn.innerText); }
    function setTempo(btn, val) { selectedData.tempo = val; highlightSingle('#tempoGroup', btn.innerText); }
    function togglePF(btn) { btn.classList.toggle('selected'); }

    function highlightSingle(parentSelector, text) {
        const btns = document.querySelector(parentSelector).querySelectorAll('.cat-btn');
        btns.forEach(b => b.classList.toggle('selected', b.innerText === text));
    }

    function addSpec() {
        const d = document.getElementById('sDur').value;
        const u = document.getElementById('sUnit').value;
        const r = document.getElementById('sRatio').value;
        const s = document.getElementById('sRes').value;
        const f = document.getElementById('sFps').value;
        const q = document.getElementById('sQty').value || 1;
        if(!d) return;
        specs.push({d: d+u, r, s, f, q});
        document.getElementById('specTable').style.display = 'table';
        document.getElementById('specBody').innerHTML = specs.map((x, i) => `
            <tr><td>${x.d}</td><td>${x.r}</td><td>${x.s}</td><td>${x.f}</td><td>${x.q}개</td>
            <td onclick="specs.splice(${i},1);addSpec();" style="color:red;cursor:pointer;">×</td></tr>
        `).join('');
    }

    function showResult() {
        document.getElementById('formView').style.display = 'none';
        document.getElementById('resultView').style.display = 'block';
        const brand = document.getElementById('brandName').value;
        const age = document.getElementById('targetAge').value;
        const job = document.getElementById('targetJob').value;
        const life = document.getElementById('targetLife').value;
        const pfs = Array.from(document.querySelectorAll('.pf-btn.selected')).map(b => b.innerText).join(', ');

        document.getElementById('resSentence').innerHTML = `
            <b>${brand}</b> 프로젝트는 <b>${age}</b> 연령대의 <b>${job}</b> 계층 중 <b>${life}</b> 성향을 가진 분들을 핵심 타겟으로 합니다. 
            <b>"${selectedData.uspSub}"</b>를 강조하기 위해 <b>${selectedData.visual}</b> 비주얼과 <b>${selectedData.tempo}</b> 템포를 결합한 콘텐츠를 제작합니다.
        `;

        const rows = [
            {l: '제작 유형', v: document.getElementById('contentType').value},
            {l: '핵심 타겟', v: `${age} / ${job} / ${life}`},
            {l: '톤앤매너', v: `${selectedData.visual} 스타일 / ${selectedData.tempo}`},
            {l: '송출 플랫폼', v: pfs || '미지정'},
            {l: '상세 스펙', v: specs.map(s => `${s.d} | ${s.r} | ${s.s} | ${s.f} | ${s.q}개`).join('<br>')}
        ];
        document.getElementById('resBody').innerHTML = rows.map(r => `<tr><th>${r.l}</th><td>${r.v}</td></tr>`).join('');
    }
</script>
</body>
</html>
