<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스마트 프로젝트 빌더 v5.6</title>
    <style>
        :root {
            --primary: #1e40af;
            --accent: #3b82f6;
            --bg: #f8fafc;
            --card: #ffffff;
            --border: #e2e8f0;
            --text: #1e293b;
        }

        body { font-family: 'Pretendard', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; line-height: 1.6; }
        .container { max-width: 750px; margin: 0 auto; background: var(--card); padding: 40px; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }

        .progress-container { width: 100%; height: 6px; background: #e2e8f0; border-radius: 10px; margin-bottom: 40px; }
        .progress-bar { height: 100%; background: var(--primary); border-radius: 10px; width: 14.2%; transition: 0.3s; }
        .step-count { font-size: 13px; font-weight: 700; color: var(--accent); margin-bottom: 10px; display: block; }

        .step-section { display: none; }
        .step-section.active { display: block; animation: fadeIn 0.4s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .q-label { font-size: 22px; font-weight: 800; margin-bottom: 25px; display: block; color: var(--primary); }
        .item-label { font-weight: 700; font-size: 15px; margin-top: 20px; display: block; color: #475569; }

        .category-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .cat-btn { padding: 16px; border: 2px solid #e2e8f0; border-radius: 12px; cursor: pointer; text-align: center; font-weight: 600; transition: 0.2s; background: #fff; font-size: 14px; }
        .cat-btn.selected { border-color: var(--primary); background: #eff6ff; color: var(--primary); }

        select, input { width: 100%; padding: 15px; border: 2px solid #e2e8f0; border-radius: 12px; font-size: 15px; box-sizing: border-box; margin-top: 10px; }

        /* 제작사양 테이블 스타일 */
        .spec-builder { background: #f1f5f9; padding: 25px; border-radius: 15px; margin-top: 20px; }
        .spec-row { display: grid; grid-template-columns: 1fr 0.6fr 1.2fr 1fr 1fr 50px; gap: 8px; margin-bottom: 10px; align-items: end; }
        .spec-row label { font-size: 11px; font-weight: 700; margin-bottom: 5px; display: block; }
        .spec-row input, .spec-row select { margin: 0; padding: 10px; font-size: 13px; }

        .added-table { width: 100%; border-collapse: collapse; background: white; margin-top: 15px; font-size: 12px; border-radius: 10px; overflow: hidden; }
        .added-table th { background: #e2e8f0; padding: 10px; border: 1px solid #cbd5e1; }
        .added-table td { border: 1px solid #cbd5e1; padding: 10px; text-align: center; background: #fff; }
        .editable-td { background: #fffdf0 !important; cursor: text; font-weight: 600; color: #b45309; }
        .editable-td:hover { background: #fffbeb !important; }
        .del-btn { color: #ef4444; font-weight: 800; cursor: pointer; font-size: 16px; }

        .nav-btns { margin-top: 40px; display: flex; gap: 10px; }
        .btn-prev { background: #e2e8f0; color: #475569; width: 100px; }
        .btn-next { background: var(--primary); color: white; flex: 1; }
        button { padding: 18px; border-radius: 14px; border: none; font-weight: 700; cursor: pointer; }

        #resultView { display: none; }
        .final-box { border: 2px solid var(--primary); padding: 30px; border-radius: 20px; }
        .res-table { width: 100%; border-collapse: collapse; margin-bottom: 30px; }
        .res-table th { background: #f8fafc; width: 160px; text-align: left; padding: 15px; border: 1px solid #e2e8f0; font-size: 14px; }
        .res-table td { padding: 15px; border: 1px solid #e2e8f0; font-size: 15px; }

        .notice-box { background: #fff7ed; border: 1px solid #ffedd5; padding: 20px; border-radius: 12px; margin-top: 20px; font-size: 13px; color: #9a3412; }
    </style>
</head>
<body>

<div class="container">
    <span class="step-count" id="stepIndicator">STEP 1 / 7</span>
    <div class="progress-container"><div class="progress-bar" id="progressBar"></div></div>

    <div id="formView">
        <div class="step-section active" data-step="1">
            <span class="q-label">프로젝트 명칭</span>
            <input type="text" id="brandName" placeholder="예: 브랜드 리뉴얼 영상 프로젝트">
            <span class="item-label">콘텐츠 유형</span>
            <select id="contentType">
                <option value="홍보 영상">홍보 영상 (브랜드/TVCF)</option>
                <option value="SNS 콘텐츠">SNS 콘텐츠 (릴스/쇼츠)</option>
                <option value="기타 전시">기타 전시 및 박람회용</option>
            </select>
        </div>

        <div class="step-section" data-step="2">
            <span class="q-label">핵심 강점(USP)</span>
            <div class="category-group">
                <div class="cat-btn" onclick="selectUSP('기술력', ['독보적 특허', '최첨단 사양'])">성능/기술</div>
                <div class="cat-btn" onclick="selectUSP('디자인', ['트렌디 디자인', '심미적 비주얼'])">디자인/감성</div>
            </div>
            <select id="uspDetail" style="display:none;"></select>
            <input type="text" id="uspCustom" placeholder="직접 입력 가능" style="margin-top:10px;">
        </div>

        <div class="step-section" data-step="3">
            <span class="q-label">목적 및 목표</span>
            <div class="category-group">
                <div class="cat-btn" onclick="selectGoal('인지도', ['브랜드 인지 확산', '바이럴 형성'])">인지도 확산</div>
                <div class="cat-btn" onclick="selectGoal('세일즈', ['판매 증대', '신규 유입 유도'])">매출 유도</div>
            </div>
            <select id="goalDetail" style="display:none;"></select>
        </div>

        <div class="step-section" data-step="4">
            <span class="q-label">타겟 세분화</span>
            <span class="item-label">연령대</span>
            <select id="targetAge"><option>2030 사회초년생</option><option>3040 핵심소비층</option></select>
            <span class="item-label">직업군</span>
            <select id="targetJob"><option>사무직 직장인</option><option>학생/취준생</option></select>
            <span class="item-label">라이프스타일</span>
            <select id="targetLife"><option>자기계발/헬스</option><option>가치소비/환경</option></select>
        </div>

        <div class="step-section" data-step="5">
            <span class="q-label">톤앤매너 조합</span>
            <span class="item-label">비주얼</span>
            <div class="category-group" id="visualGroup">
                <div class="cat-btn" onclick="setVisual(this, '시네마틱한')">시네마틱</div>
                <div class="cat-btn" onclick="setVisual(this, '미니멀한')">미니멀</div>
            </div>
            <span class="item-label">템포</span>
            <div class="category-group" id="tempoGroup">
                <div class="cat-btn" onclick="setTempo(this, '빠른 리듬')">빠른 템포</div>
                <div class="cat-btn" onclick="setTempo(this, '안정적 리듬')">안정적 템포</div>
            </div>
        </div>

        <div class="step-section" data-step="6">
            <span class="q-label">송출 플랫폼</span>
            <div class="category-group" id="pfGroup">
                <div class="cat-btn" onclick="this.classList.toggle('selected')">유튜브</div>
                <div class="cat-btn" onclick="this.classList.toggle('selected')">인스타그램</div>
                <div class="cat-btn" onclick="this.classList.toggle('selected')">TV 광고</div>
            </div>
        </div>

        <div class="step-section" data-step="7">
            <span class="q-label">제작 사양 (노란 부분 클릭 시 수정 가능)</span>
            <div class="spec-builder">
                <div class="spec-row">
                    <div><label>분량</label><input type="number" id="sDur" placeholder="30"></div>
                    <div><label>단위</label><select id="sUnit"><option value="초">초</option><option value="분">분</option></select></div>
                    <div><label>비율</label><select id="sRatio"><option>16:9</option><option>9:16</option><option>1:1</option></select></div>
                    <div><label>해상도</label><select id="sRes"><option>4K</option><option>FHD</option><option>720p</option></select></div>
                    <div><label>프레임</label><select id="sFps"><option>24fps</option><option selected>30fps</option><option>60fps</option></select></div>
                    <button type="button" onclick="addSpec()" style="background:var(--primary); color:white;">+</button>
                </div>
                <input type="number" id="sQty" placeholder="수량(개)" style="width:120px; margin-top:10px;">
                
                <table class="added-table" id="specTable" style="display:none;">
                    <thead><tr><th>분량</th><th>비율</th><th>해상도</th><th>프레임</th><th>수량</th><th>삭제</th></tr></thead>
                    <tbody id="specBody"></tbody>
                </table>
            </div>
        </div>

        <div class="nav-btns">
            <button class="btn-prev" id="prevBtn" style="visibility:hidden;" onclick="moveStep(-1)">이전</button>
            <button class="btn-next" id="nextBtn" onclick="moveStep(1)">다음으로</button>
        </div>
    </div>

    <div id="resultView">
        <header><h1>PROJECT DEFINITION</h1></header>
        <div class="final-box">
            <div class="final-sentence" id="resSentence"></div>
            <table class="res-table" id="resBody"></table>
            <div class="notice-box">
                <b>💡 안내사항:</b> 제작 사양 항목을 클릭하여 수정한 경우, 해당 내용이 최종 정의서에 반영됩니다.
            </div>
        </div>
        <div class="nav-btns">
            <button class="btn-next" onclick="window.print()">PDF 저장</button>
            <button class="btn-prev" onclick="location.reload()">새로 작성</button>
        </div>
    </div>
</div>

<script>
    let currStep = 1;
    let specs = []; // {d, r, s, f, q} 형식 저장
    let sel = { visual: '', tempo: '', uspCat: '', uspSub: '', goalCat: '', goalSub: '' };

    function moveStep(n) {
        if(n === 1 && currStep === 1 && !document.getElementById('brandName').value) return alert("프로젝트 이름을 써주세요!");
        document.querySelector(`[data-step="${currStep}"]`).classList.remove('active');
        currStep += n;
        if(currStep > 7) return showResult();
        document.querySelector(`[data-step="${currStep}"]`).classList.add('active');
        document.getElementById('stepIndicator').innerText = `STEP ${currStep} / 7`;
        document.getElementById('progressBar').style.width = (currStep * 14.2) + '%';
        document.getElementById('prevBtn').style.visibility = currStep === 1 ? 'hidden' : 'visible';
        document.getElementById('nextBtn').innerText = currStep === 7 ? '정의서 완성' : '다음으로';
    }

    function selectUSP(cat, subs) { 
        sel.uspCat = cat; 
        const el = document.getElementById('uspDetail');
        el.style.display = 'block'; el.innerHTML = subs.map(s => `<option value="${s}">${s}</option>`).join('');
        sel.uspSub = subs[0]; el.onchange = (e) => sel.uspSub = e.target.value;
        highlight('[data-step="2"]', cat);
    }

    function selectGoal(cat, subs) { 
        sel.goalCat = cat; 
        const el = document.getElementById('goalDetail');
        el.style.display = 'block'; el.innerHTML = subs.map(s => `<option value="${s}">${s}</option>`).join('');
        sel.goalSub = subs[0]; el.onchange = (e) => sel.goalSub = e.target.value;
        highlight('[data-step="3"]', cat);
    }

    function setVisual(btn, val) { sel.visual = val; highlight('#visualGroup', btn.innerText); }
    function setTempo(btn, val) { sel.tempo = val; highlight('#tempoGroup', btn.innerText); }

    function highlight(parent, text) {
        const btns = document.querySelector(parent).querySelectorAll('.cat-btn');
        btns.forEach(b => b.classList.toggle('selected', b.innerText === text));
    }

    // 제작사양 추가
    function addSpec() {
        const d = document.getElementById('sDur').value;
        const u = document.getElementById('sUnit').value;
        const r = document.getElementById('sRatio').value;
        const s = document.getElementById('sRes').value;
        const f = document.getElementById('sFps').value;
        const q = document.getElementById('sQty').value || 1;
        if(!d) return alert("분량을 입력하세요");

        specs.push({ d: d + u, r, s, f, q: q + '개' });
        renderSpecList();
        document.getElementById('sDur').value = '';
    }

    // 리스트 렌더링 (삭제 및 수정 기능 포함)
    function renderSpecList() {
        const table = document.getElementById('specTable');
        const body = document.getElementById('specBody');
        if(specs.length === 0) { table.style.display = 'none'; return; }
        
        table.style.display = 'table';
        body.innerHTML = specs.map((item, i) => `
            <tr>
                <td contenteditable="true" class="editable-td" onblur="updateData(${i}, 'd', this.innerText)">${item.d}</td>
                <td contenteditable="true" class="editable-td" onblur="updateData(${i}, 'r', this.innerText)">${item.r}</td>
                <td contenteditable="true" class="editable-td" onblur="updateData(${i}, 's', this.innerText)">${item.s}</td>
                <td contenteditable="true" class="editable-td" onblur="updateData(${i}, 'f', this.innerText)">${item.f}</td>
                <td contenteditable="true" class="editable-td" onblur="updateData(${i}, 'q', this.innerText)">${item.q}</td>
                <td><span class="del-btn" onclick="removeSpec(${i})">×</span></td>
            </tr>
        `).join('');
    }

    // 부분 수정 함수
    function updateData(index, key, value) {
        specs[index][key] = value;
    }

    // 개별 삭제 함수
    function removeSpec(index) {
        specs.splice(index, 1);
        renderSpecList();
    }

    function showResult() {
        document.getElementById('formView').style.display = 'none';
        document.getElementById('resultView').style.display = 'block';
        const brand = document.getElementById('brandName').value;
        const pfs = Array.from(document.querySelectorAll('#pfGroup .cat-btn.selected')).map(b => b.innerText).join(', ');

        document.getElementById('resSentence').innerHTML = `
            <b>${brand}</b> 프로젝트는 <b>"${sel.uspSub}"</b>를 핵심 가치로 하며, 
            <b>${sel.visual || '기본'}</b> 비주얼과 <b>${sel.tempo || '안정적'}</b> 템포의 연출을 지향합니다.
        `;

        const rows = [
            {l: '프로젝트 성격', v: document.getElementById('contentType').value},
            {l: '타겟 세분화', v: `${document.getElementById('targetAge').value} / ${document.getElementById('targetJob').value}`},
            {l: '송출 플랫폼', v: pfs || '미지정'},
            {l: '제작 상세 스펙', v: specs.map(s => `${s.d} | ${s.r} | ${s.s} | ${s.f} | ${s.q}`).join('<br>') || '미입력'}
        ];
        document.getElementById('resBody').innerHTML = rows.map(r => `<tr><th>${r.l}</th><td>${r.v}</td></tr>`).join('');
    }
</script>
</body>
</html>
